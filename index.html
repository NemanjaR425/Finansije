<!DOCTYPE html>
<html lang="sr-ME">
<head>
    <meta charset="UTF-8">
    <title>Final Market Monitor</title>
    <style>
        :root {
            --bg-dark: #121e31; --panel-bg: #1d2b41; --header-bg: #34495e;
            --text-main: #ffffff; --up: #2ecc71; --down: #e74c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #render-surface {
            width: 1920px; height: 1080px; background-color: var(--bg-dark);
            color: var(--text-main); position: absolute; top: 0; left: 0;
            display: flex; flex-direction: column; padding: 30px; transform-origin: top left;
        }
        .header { height: 80px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .main-content { flex-grow: 1; display: grid; grid-template-columns: 480px 1fr 480px; gap: 25px; min-height: 0; }
        .panel { background: var(--panel-bg); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
        .panel-header { height: 60px; background: var(--header-bg); display: flex; align-items: center; justify-content: center; font-weight: bold; text-transform: uppercase; font-size: 1rem; }
        .market-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .mini-row td { height: 80px; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        .flex-cell { display: flex; align-items: center; gap: 15px; }
        .market-icon { width: 42px; height: 42px; border-radius: 6px; object-fit: contain; background: transparent; }
        .sym-container { display: flex; flex-direction: column; line-height: 1.2; }
        .sym-short { font-size: 1.3rem; font-weight: 700; }
        .sym-full { font-size: 0.85rem; color: rgba(255,255,255,0.5); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
        .price-now { font-size: 1.7rem; font-weight: 700; font-family: monospace; }
    </style>
</head>
<body>
    <div id="render-surface">
        <div class="header">
            <h1 style="font-size: 3.5rem;">LIVE MARKET WATCH</h1>
            <div id="current-time" style="font-size: 2.8rem;">00:00:00</div>
        </div>
        <div class="main-content">
            <div style="display: flex; flex-direction: column; gap: 25px;">
                <div class="panel" style="height: calc(50% - 12.5px);"><div class="panel-header">Forex Rates</div><table class="market-table" id="fx-body"></table></div>
                <div class="panel" style="height: calc(50% - 12.5px);"><div class="panel-header">Crypto Prices</div><table class="market-table" id="crypto-body"></table></div>
            </div>
            <div class="panel">
                <div class="panel-header" id="stock-header">NYSE Most Active (1/3)</div>
                <table class="market-table" id="stock-body"></table>
            </div>
            <div class="panel">
                <div class="panel-header">Herceg Novi Weather</div>
                <div id="weather-container" style="flex-grow:1; display:flex; align-items:center; justify-content:center; padding:20px;">
                    <a class="weatherwidget-io" href="https://forecast7.com/sr/42d4518d54/herceg-novi/" 
                       data-label_1="HERCEG NOVI" 
                       data-label_2="MONTENEGRO" 
                       data-font="Roboto" 
                       data-icons="Climacons Animated" 
                       data-theme="dark" 
                       data-basecolor="#1d2b41" 
                       data-accent="rgba(255, 255, 255, 0)" 
                       data-textcolor="#ffffff" 
                       style="width: 100%; display: block;">Učitavam prognozu...</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'd75qlb9r01qk56kdov40d75qlb9r01qk56kdov4g';
        const companyNames = {
            'AAPL':'Apple Inc.', 'NVDA':'NVIDIA Corporation', 'TSLA':'Tesla, Inc.', 'MSFT':'Microsoft Corp.', 
            'AMZN':'Amazon.com, Inc.', 'META':'Meta Platforms, Inc.', 'GOOGL':'Alphabet Inc.', 'AMD':'Adv. Micro Devices', 
            'NFLX':'Netflix, Inc.', 'TSM':'Taiwan Semi.', 'V':'Visa Inc.', 'WMT':'Walmart Inc.', 
            'MA':'Mastercard Inc.', 'AVGO':'Broadcom Inc.', 'PG':'Procter & Gamble', 'ORCL':'Oracle Corporation', 
            'COST':'Costco Wholesale', 'ADBE':'Adobe Inc.', 'HD':'Home Depot Inc.', 'BAC':'Bank of America', 
            'CVX':'Chevron Corp.', 'LLY':'Eli Lilly & Co.', 'ABBV':'AbbVie Inc.', 'KO':'Coca-Cola Co.', 
            'PEP':'PepsiCo, Inc.', 'CRM':'Salesforce, Inc.', 'T':'AT&T Inc.', 'INTC':'Intel Corporation', 
            'DIS':'Disney Co.', 'PYPL':'PayPal Holdings'
        };
        const tickers = Object.keys(companyNames);
        let stockPrices = {};
        let currentSlide = 0;

        // Weather Fix: Forsirano učitavanje skripte
        function loadWeather() {
            if (typeof __weatherwidget_init === 'function') {
                __weatherwidget_init();
            } else {
                const script = document.createElement('script');
                script.id = 'weatherwidget-io-js';
                script.src = 'https://weatherwidget.io/js/widget.min.js';
                document.body.appendChild(script);
            }
        }

        function handleErr(img, s) {
            img.onerror = null;
            img.src = `https://ui-avatars.com/api/?name=${s}&background=34495e&color=fff&bold=true`;
        }

        function buildRow(s, p, c, iconUrl, fullName = "") {
            const color = parseFloat(c) >= 0 ? 'var(--up)' : 'var(--down)';
            return `<tr class="mini-row">
                <td><div class="flex-cell">
                    <img class="market-icon" src="${iconUrl}" onerror="handleErr(this, '${s}')">
                    <div class="sym-container">
                        <span class="sym-short">${s}</span>
                        ${fullName ? `<span class="sym-full">${fullName}</span>` : ''}
                    </div>
                </div></td>
                <td style="text-align:right">
                    <span class="price-now">${p}</span><br>
                    <span style="color:${color};font-weight:600">${parseFloat(c)>=0?'+':''}${c}%</span>
                </td>
            </tr>`;
        }

        async function updateStocks() {
            for (let s of tickers) {
                try {
                    const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${API_KEY}`);
                    const d = await res.json();
                    if (d.c) stockPrices[s] = { p: d.c.toFixed(2), c: d.dp.toFixed(2) };
                } catch(e) {}
            }
            renderSlide();
        }

        function renderSlide() {
            const container = document.getElementById('stock-body');
            const start = currentSlide * 10;
            const slice = tickers.slice(start, start + 10);
            container.innerHTML = slice.map(s => {
                const data = stockPrices[s] || {p: '---', c: '0.00'};
                return buildRow(s, data.p, data.c, `https://financialmodelingprep.com/image-stock/${s}.png`, companyNames[s]);
            }).join('');
            document.getElementById('stock-header').innerText = `NYSE Most Active (${currentSlide + 1}/3)`;
            currentSlide = (currentSlide + 1) % 3;
        }

        async function updateCrypto() {
            const names = {'BTC':'Bitcoin', 'ETH':'Ethereum', 'SOL':'Solana', 'ADA':'Cardano'};
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT","SOLUSDT","ADAUSDT"]');
                const data = await res.json();
                document.getElementById('crypto-body').innerHTML = data.map(c => {
                    const sym = c.symbol.replace('USDT','');
                    return buildRow(sym, parseFloat(c.lastPrice).toLocaleString(), parseFloat(c.priceChangePercent).toFixed(2), 
                    `https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/${sym.toLowerCase()}.png`, names[sym]);
                }).join('');
            } catch(e) {}
        }

        async function updateForex() {
            const names = {'EURUSD':'Euro / US Dollar', 'GBPUSD':'British Pound', 'USDJPY':'US Dollar / Yen', 'USDCHF':'US Dollar / Franc'};
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                const pairs = [
                    {s:"EURUSD", p:(1/data.rates.EUR).toFixed(4), i:"eu"},
                    {s:"GBPUSD", p:(1/data.rates.GBP).toFixed(4), i:"gb"},
                    {s:"USDJPY", p:data.rates.JPY.toFixed(2), i:"us"},
                    {s:"USDCHF", p:data.rates.CHF.toFixed(4), i:"ch"}
                ];
                document.getElementById('fx-body').innerHTML = pairs.map(f => buildRow(f.s, f.p, "0.02", `https://flagcdn.com/w80/${f.i}.png`, names[f.s])).join('');
            } catch(e) {}
        }

        // Inicijalizacija
        updateStocks(); updateCrypto(); updateForex(); loadWeather();
        
        setInterval(updateStocks, 60000);
        setInterval(renderSlide, 10000);
        setInterval(updateCrypto, 5000);
        setInterval(() => { document.getElementById('current-time').innerText = new Date().toLocaleTimeString('sr-ME'); }, 1000);

        function autoScale() { 
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); 
            document.getElementById('render-surface').style.transform = `scale(${scale})`; 
        }
        window.addEventListener('resize', autoScale); autoScale();
    </script>
</body>
</html>
